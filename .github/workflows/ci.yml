name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Black
        run: black --check src api scripts tests pipeline.py
      - name: Ruff
        run: ruff check src api scripts tests pipeline.py
      - name: mypy
        run: mypy src api scripts

  test:
    name: Pytest, dbt, Docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: medical_warehouse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: test_password
      DB_NAME: medical_warehouse_test
      DBT_TARGET: ci
      API_KEY: test-api-key
      SKIP_YOLO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Migrate and seed
        run: |
          python -m scripts.migrate
          python -m scripts.seed_demo
      - name: Pytest
        run: python -m pytest tests/ -v --tb=short
      - name: dbt debug / compile / run / test
        run: |
          dbt debug --project-dir medical_warehouse --profiles-dir medical_warehouse
          dbt compile --project-dir medical_warehouse --profiles-dir medical_warehouse
          dbt run --project-dir medical_warehouse --profiles-dir medical_warehouse
          dbt test --project-dir medical_warehouse --profiles-dir medical_warehouse
      - name: Docker build
        run: docker build -t medical-telegram-warehouse:ci .

  docker-compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
