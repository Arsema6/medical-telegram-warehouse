medical_warehouse:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'warehouse') }}"
      password: "{{ env_var('DB_PASSWORD', 'warehouse') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DB_NAME', 'medical_warehouse') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
      threads: 4
    ci:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'postgres') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DB_NAME', 'medical_warehouse_test') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
      threads: 2
