version: 2

models:
  - name: dim_channels
    description: "Dimension table containing information about Telegram channels."

    columns:
      - name: channel_key
        description: "Surrogate primary key for each Telegram channel."
        tests:
          - unique
          - not_null

      - name: channel_name
        description: "Name of the Telegram channel."

      - name: channel_type
        description: "Business category of the channel (Medical, Pharmaceutical, Cosmetics)."

      - name: first_post_date
        description: "Date of the earliest scraped message."

      - name: last_post_date
        description: "Date of the latest scraped message."

      - name: total_posts
        description: "Total number of scraped posts."

      - name: avg_views
        description: "Average number of views per message."

  - name: dim_dates
    description: "Date dimension used for time-based analysis."

    columns:
      - name: date_key
        description: "Primary key in YYYYMMDD format."
        tests:
          - unique
          - not_null

      - name: full_date
        description: "Calendar date."

      - name: day_of_week
        description: "Day number within the week."

      - name: day_name
        description: "Name of the weekday."

      - name: week_of_year
        description: "Week number within the year."

      - name: month
        description: "Month number."

      - name: month_name
        description: "Name of the month."

      - name: quarter
        description: "Quarter of the year."

      - name: year
        description: "Calendar year."

      - name: is_weekend
        description: "True if the date falls on a weekend."

  - name: fct_messages
    description: "Fact table containing one record for each Telegram message."

    columns:
      - name: message_id
        description: "Unique Telegram message identifier."
        tests:
          - unique
          - not_null

      - name: channel_key
        description: "Foreign key referencing dim_channels."
        tests:
          - relationships:
              to: ref('dim_channels')
              field: channel_key

      - name: date_key
        description: "Foreign key referencing dim_dates."
        tests:
          - relationships:
              to: ref('dim_dates')
              field: date_key

      - name: message_text
        description: "Text content of the Telegram message."

      - name: message_length
        description: "Number of characters in the message."

      - name: view_count
        description: "Number of message views."

      - name: forward_count
        description: "Number of times the message was forwarded."

      - name: has_image
        description: "Indicates whether the message contains an image."

      - name: image_path
        description: "Path to the downloaded image if present."

  - name: fct_image_detections
    description: "Fact table containing YOLO object detection results for images."

    columns:
      - name: message_id
        description: "Foreign key referencing fct_messages."

      - name: channel_key
        description: "Foreign key referencing dim_channels."

      - name: date_key
        description: "Foreign key referencing dim_dates."

      - name: detected_class
        description: "Detected object class from YOLO."

      - name: image_category
        description: "Categorized image type (promotional, product_display, lifestyle, other)."

      - name: detection_channel
        description: "Channel name from detection results."