version: 2

models:
  - name: dim_channels
    description: Channel dimension (one row per Telegram channel). Grain is channel_name.
    columns:
      - name: channel_key
        description: MD5 of channel_name; stable across rebuilds.
        tests:
          - unique
          - not_null
      - name: channel_name
        tests:
          - unique
          - not_null
      - name: channel_type
        tests:
          - accepted_values:
              arguments:
                values: ["Medical", "Cosmetics", "Pharmaceutical"]
                quote: true
      - name: first_post_date
        description: Earliest scraped message timestamp.
      - name: last_post_date
        description: Latest scraped message timestamp.
      - name: total_posts
        description: Message count in the current warehouse snapshot.
        tests:
          - not_null
      - name: avg_views
        description: Average views per message.

  - name: dim_dates
    description: Date dimension derived from observed message dates (YYYYMMDD keys).
    columns:
      - name: date_key
        description: Primary key in YYYYMMDD format.
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null
      - name: day_of_week
        description: PostgreSQL DOW (0=Sunday).
      - name: day_name
        description: Calendar weekday name.
      - name: week_of_year
        description: ISO-style week number from extract(week).
      - name: month
        description: Month number 1-12.
      - name: month_name
        description: Calendar month name.
      - name: quarter
        description: Quarter of the year.
      - name: year
        description: Calendar year.
      - name: is_weekend
        description: True when DOW is Sunday or Saturday.

  - name: fct_messages
    description: >
      Fact table at message grain. Foreign keys to dim_channels and dim_dates.
      Incremental on updated_at so view counts can refresh without duplicates.
    columns:
      - name: message_key
        description: Surrogate primary key (md5 of channel + message_id).
        tests:
          - unique
          - not_null
      - name: message_id
        tests:
          - not_null
      - name: channel_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: channel_name
        description: Degenerate dimension for convenient filters.
        tests:
          - not_null
      - name: message_text
        description: Message body.
      - name: message_length
        description: Character length.
      - name: view_count
        tests:
          - not_null
      - name: forward_count
        tests:
          - not_null
      - name: has_image
        description: True when an image path is present.

  - name: fct_image_detections
    description: Image-level YOLO (or demo) detections joined to message facts.
    columns:
      - name: detection_key
        tests:
          - unique
          - not_null
      - name: message_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_messages')
                field: message_key
      - name: channel_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: image_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["promotional", "product_display", "lifestyle", "other"]
                quote: true
      - name: detected_objects
        description: JSON array of COCO class names stored as text.
      - name: max_confidence
        description: Highest box confidence from YOLO when available.
