version: 2

models:
  - name: stg_telegram_messages
    description: "Cleaned and standardized Telegram messages used as the staging layer."

    columns:
      - name: message_id
        description: "Unique Telegram message identifier."

      - name: channel_name
        description: "Source Telegram channel."

      - name: channel_type
        description: "Business category of the channel (Medical, Pharmaceutical, Cosmetics)."

      - name: message_date
        description: "Date and time the message was published."

      - name: message_text
        description: "Text content of the Telegram message."

      - name: views
        description: "Number of message views."

      - name: forwards
        description: "Number of times the message was forwarded."

      - name: has_media
        description: "Whether the message contains media."

      - name: message_length
        description: "Length of the message text."

      - name: has_image
        description: "True if the message contains an image."