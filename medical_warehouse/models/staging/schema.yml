version: 2

models:
  - name: stg_telegram_messages
    description: >
      Cleaned Telegram messages at one row per channel + message_id.
      Filters null keys and standardizes views/forwards/has_image.
    columns:
      - name: message_key
        description: Stable hash of channel_name and message_id.
        tests:
          - unique
          - not_null
      - name: message_id
        description: Telegram message identifier (unique within a channel).
        tests:
          - not_null
      - name: channel_name
        description: Internal channel key from config/channels.yaml.
        tests:
          - not_null
      - name: channel_type
        description: Business category of the channel.
        tests:
          - accepted_values:
              arguments:
                values: ["Medical", "Cosmetics", "Pharmaceutical"]
                quote: true
      - name: message_date
        description: Timestamp the message was published (UTC when provided).
      - name: message_text
        description: Text content of the Telegram message.
      - name: views
        description: View count, coalesced to zero.
        tests:
          - not_null
      - name: forwards
        description: Forward count, coalesced to zero.
        tests:
          - not_null
      - name: has_media
        description: Whether Telegram reported media on the message.
      - name: message_length
        description: Character length of message_text.
      - name: has_image
        description: True when a local image_path was stored.
      - name: image_path
        description: Path to the downloaded image if present.
