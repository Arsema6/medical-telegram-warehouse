[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  \.venv
  | venv
  | medical_warehouse/target
  | medical_warehouse/dbt_packages
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "scripts", "tests"]
extend-exclude = ["medical_warehouse/target", "medical_warehouse/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "api", "scripts"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
show_error_codes = true
warn_unused_ignores = true
files = ["src", "api", "scripts"]
exclude = ["medical_warehouse/target"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that require a reachable PostgreSQL instance",
]
